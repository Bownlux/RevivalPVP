// mc/1.21.11 branch. Differences from main (26.1):
//   - minecraft_version + fabric_version + java_version per gradle.properties
//   - access_widener_namespace=intermediary because fabric-api 0.141.x's
//     bundled AWs are still in intermediary namespace
buildscript {
    repositories {
        maven { url = "https://maven.fabricmc.net/" }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath "net.fabricmc:fabric-loom:${project.property('loom_version')}"
    }
}

apply plugin: "fabric-loom"
apply plugin: "maven-publish"

version = "${project.mod_version}-${project.minecraft_version}"
group = project.maven_group

base { archivesName = project.archives_base_name }

repositories {
    mavenCentral()
    maven { url = "https://maven.terraformersmc.com/releases/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // Source uses mojmap class names (net.minecraft.network.chat.Component
    // etc.). Use Mojang's official mappings to match the source as-is.
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // WebSocket client (Tyrus standalone, shaded)
    implementation "org.glassfish.tyrus.bundles:tyrus-standalone-client:2.1.5"
    include "org.glassfish.tyrus.bundles:tyrus-standalone-client:2.1.5"
}

loom {
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
        }
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version,
               "mod_mc_dep": project.mod_mc_dep,
               "mod_java_dep": project.mod_java_dep
    }
}

def javaVer = Integer.parseInt(project.java_version)
tasks.withType(JavaCompile).configureEach { it.options.release = javaVer }
java {
    withSourcesJar()
    def jv = JavaVersion.toVersion(javaVer)
    sourceCompatibility = jv
    targetCompatibility = jv
}
