org.gradle.jvmargs=-Xmx2G
# org.gradle.java.home is intentionally NOT set here — Gradle picks up
# JAVA_HOME from the environment, which lets CI (which sets it via
# actions/setup-java) and local devs (with $JAVA_HOME on the right JDK)
# both work without a hardcoded path. If you need a specific JDK locally,
# set JAVA_HOME or put org.gradle.java.home in ~/.gradle/gradle.properties.

# Minecraft 26.1 — matches Prism instance "Vloxnux PVP MOD 26.1.2"
minecraft_version=26.1
loom_version=1.15-SNAPSHOT
loader_version=0.18.6
fabric_version=0.145.4+26.1.1

mod_version=1.1.1
# Friendly codename for this release, shown in the in-game mod info screen.
# Bump alongside mod_version. Leave blank for a nameless point release.
release_name=
maven_group=net.revivalsmp
archives_base_name=revival-pvp-mod

java_version=25
mod_mc_dep=>=26.1
mod_java_dep=>=25
use_mojmap=false
access_widener_namespace=official
