org.gradle.jvmargs=-Xmx2G

# Minecraft 1.21.11 build profile (mc/1.21.11 branch). The 26.1+ build lives
# on main. Branches stay in sync source-wise; only this file + the loom block
# in build.gradle differ.
minecraft_version=1.21.11
loom_version=1.13.6
loader_version=0.18.6
fabric_version=0.141.3+1.21.11
yarn_mappings=1.21.11+build.4

mod_version=1.0.1
maven_group=net.revivalsmp
archives_base_name=revival-pvp-mod

java_version=21
mod_mc_dep=>=1.21.11 <26
mod_java_dep=>=21
use_mojmap=false
# fabric-api 0.141.x ships its bundled access wideners in the intermediary
# namespace (changed to official starting around 0.144). Loom needs to be
# told to expect intermediary so the upstream AWs load cleanly.
access_widener_namespace=intermediary
