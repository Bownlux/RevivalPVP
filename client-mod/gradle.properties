org.gradle.jvmargs=-Xmx2G
# org.gradle.java.home intentionally NOT set — pick up JAVA_HOME from env
# so CI on Linux and local dev both work without a hardcoded path.

# Minecraft 1.21.4 build profile (mc/1.21.4 branch). Companion branches:
#   main         -> 26.1 (Java 25)
#   mc/1.21.11   -> 1.21.11 (Java 21)
#   mc/1.21.4    -> 1.21.4  (Java 21)  <-- THIS BRANCH
# Source stays in sync; only this file + build.gradle's loom block differ.
minecraft_version=1.21.4
loom_version=1.9-SNAPSHOT
loader_version=0.16.10
fabric_version=0.119.4+1.21.4
yarn_mappings=1.21.4+build.8

mod_version=1.0.1
maven_group=net.revivalsmp
archives_base_name=revival-pvp-mod

java_version=21
mod_mc_dep=>=1.21.4 <1.21.5
mod_java_dep=>=21
use_mojmap=false
# fabric-api 0.119.x ships its bundled access wideners in the intermediary
# namespace (same as the 1.21.11 branch). Loom needs intermediary to load
# the upstream AWs cleanly.
access_widener_namespace=intermediary
