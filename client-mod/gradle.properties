org.gradle.jvmargs=-Xmx2G
# org.gradle.java.home intentionally NOT set — pick up JAVA_HOME from env
# so CI and local devs both work.

# Minecraft 1.21.7 build profile (mc/1.21.7 branch). Covers the gap
# between 1.21.5 and 1.21.10. Companion branches:
#   main         -> 26.1   (Java 25)
#   mc/1.21.11   -> 1.21.11 (Java 21)
#   mc/1.21.7    -> 1.21.7  (Java 21)  <-- THIS BRANCH
#   mc/1.21.4    -> 1.21.4  (Java 21)
minecraft_version=1.21.7
loom_version=1.10-SNAPSHOT
loader_version=0.16.14
fabric_version=0.129.0+1.21.7
yarn_mappings=1.21.7+build.8

mod_version=1.0.5
maven_group=net.revivalsmp
archives_base_name=revival-pvp-mod

java_version=21
mod_mc_dep=>=1.21.5 <1.21.11
mod_java_dep=>=21
use_mojmap=false
# fabric-api 0.129.x bundled access wideners are still in intermediary
access_widener_namespace=intermediary
