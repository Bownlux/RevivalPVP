name: release-client-mod

# Triggered by a tag like `client-v1.1.0` (main, MC 26.1) or
# `client-v1.0.0-mc1.21.4` (the mc/1.21.4 branch). Builds the jar and
# attaches it to a fresh GitHub release. The server mod has its own
# release workflow under tag prefix `server-v*`.
#
# Java version is auto-detected from `client-mod/gradle.properties`
# (java_version key) so different MC version branches can target
# different JDKs without per-workflow forks.
on:
  push:
    tags:
      - 'client-v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Read java_version from gradle.properties
        id: javav
        working-directory: client-mod
        run: |
          v=$(grep -E '^java_version=' gradle.properties | cut -d'=' -f2 | tr -d ' \r')
          echo "Detected java_version=$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.javav.outputs.version }}
          cache: gradle
      - name: Make gradlew executable
        working-directory: client-mod
        run: chmod +x ./gradlew
      - name: Build with Gradle
        working-directory: client-mod
        run: ./gradlew build --no-daemon
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Client Mod ${{ github.ref_name }}
          generate_release_notes: true
          files: client-mod/build/libs/revival-pvp-mod-*.jar
