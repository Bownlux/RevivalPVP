name: release-client-mod

# Triggered by a tag like `client-v1.1.0`. Builds the jar and attaches it
# to a fresh GitHub release. The server mod has its own release workflow
# under tag prefix `server-v*`.
on:
  push:
    tags:
      - 'client-v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Matches gradle.properties java_version=25 / mod_java_dep=>=25
          # on the main branch.
          java-version: '25'
          cache: gradle
      - name: Make gradlew executable
        working-directory: client-mod
        run: chmod +x ./gradlew
      - name: Build with Gradle
        working-directory: client-mod
        run: ./gradlew build --no-daemon
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Client Mod ${{ github.ref_name }}
          generate_release_notes: true
          files: client-mod/build/libs/revival-pvp-mod-*.jar
