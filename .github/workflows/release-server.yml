name: release-server-mod

# Triggered by a tag like `server-v1.6.0`. Builds the jar and attaches it
# to a fresh GitHub release. The client mod has its own release workflow
# under tag prefix `client-v*`.
on:
  push:
    tags:
      - 'server-v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build with Maven
        working-directory: server-mod
        run: mvn -B -DskipTests clean package
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Server Mod ${{ github.ref_name }}
          generate_release_notes: true
          files: server-mod/target/RevivalPVPServerMod-*.jar
