name: build-server-mod

on:
  push:
    branches: [main]
    paths:
      - 'server-mod/**'
      - '.github/workflows/build-server-mod.yml'
  pull_request:
    paths:
      - 'server-mod/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build with Maven
        working-directory: server-mod
        run: mvn -B -DskipTests clean package
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: RevivalPVPServerMod
          path: server-mod/target/RevivalPVPServerMod-*.jar
          if-no-files-found: error
