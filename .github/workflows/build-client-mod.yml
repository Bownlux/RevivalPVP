name: build-client-mod

on:
  push:
    branches: [main]
    paths:
      - 'client-mod/**'
      - '.github/workflows/build-client-mod.yml'
  pull_request:
    paths:
      - 'client-mod/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Matches gradle.properties java_version=25 / mod_java_dep=>=25.
          # mc/1.21.11 branch targets Java 21 — workflow on that branch
          # should override this with 21.
          java-version: '25'
          cache: gradle
      - name: Make gradlew executable
        working-directory: client-mod
        run: chmod +x ./gradlew
      - name: Build with Gradle
        working-directory: client-mod
        run: ./gradlew build --no-daemon
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: revival-pvp-mod
          path: client-mod/build/libs/revival-pvp-mod-*.jar
          if-no-files-found: error
