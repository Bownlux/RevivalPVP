name: build-client-mod

# Builds the client mod on push to main + any mc/* version branch so we
# catch breakage across all maintained MC version targets. Java version
# is auto-detected from client-mod/gradle.properties.
on:
  push:
    branches:
      - main
      - 'mc/**'
    paths:
      - 'client-mod/**'
      - '.github/workflows/build-client-mod.yml'
  pull_request:
    paths:
      - 'client-mod/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read java_version from gradle.properties
        id: javav
        working-directory: client-mod
        run: |
          v=$(grep -E '^java_version=' gradle.properties | cut -d'=' -f2 | tr -d ' \r')
          echo "Detected java_version=$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.javav.outputs.version }}
          cache: gradle
      - name: Make gradlew executable
        working-directory: client-mod
        run: chmod +x ./gradlew
      - name: Build with Gradle
        working-directory: client-mod
        run: ./gradlew build --no-daemon
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: revival-pvp-mod-${{ github.ref_name }}
          path: client-mod/build/libs/revival-pvp-mod-*.jar
          if-no-files-found: error
